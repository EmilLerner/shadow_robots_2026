version: '3.8'

services:
  robot1:
    image: universalrobots/ursim_e-series
    container_name: ursim_robot_1
    environment:
      - ROBOT_MODEL=UR5
    ports:
      # Host Port : Container Port
      - "6081:6080"  # Web PolyScope GUI for Robot 1
      - "29999:29999"
      - "30001:30001"
      - "30002:30002"
      - "30003:30003"
      - "30004:30004"
    restart: always

  robot2:
    image: universalrobots/ursim_e-series
    container_name: ursim_robot_2
    environment:
      - ROBOT_MODEL=UR10
    ports:
      # Shift the host ports to avoid collisions
      - "6082:6080"  # Web PolyScope GUI for Robot 2
      - "29998:29999"
      - "30011:30001"
      - "30012:30002"
      - "30013:30003"
      - "30014:30004"
    restart: always
